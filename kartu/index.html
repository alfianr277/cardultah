<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Ucapan untuk Aulia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap">
<style>
:root{--ink:#5b2a4a;--soft:#a05a86;--pink:#ff5c8a;--pink2:#ffb3cf;--mint:#7ee0c3;--sky:#8fd3ff;--sun:#ffd966;--lilac:#c9b6ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fb:"Fredoka","Nunito",ui-rounded,"Comic Sans MS",system-ui,sans-serif;--fh:"Pacifico","Brush Script MT",cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,#ffe3ef,#e0f5ff 50%,#fff6cc);color:var(--ink);font-family:var(--fb);display:flex;align-items:center;justify-content:center;overflow:hidden}
#c{position:fixed;inset:0;pointer-events:none;z-index:50}
.fl{position:fixed;bottom:-60px;pointer-events:none;z-index:1;animation:up linear forwards;opacity:.85}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.screen{display:none;width:100%;max-width:460px;max-height:100%;overflow-y:auto;padding:16px;text-align:center;position:relative;z-index:2}
.screen.on{display:block;animation:in .7s cubic-bezier(.2,.9,.3,1.3)}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
h1,h2{margin:.3em 0;line-height:1.25;font-weight:600}
p{line-height:1.6;color:var(--soft);margin:.5em 0}
button{font:inherit;font-weight:600;background:linear-gradient(135deg,#ff7aa8,#ffa66b);color:#fff;border:0;border-radius:999px;padding:.65em 1.4em;margin:.8em .2em 0;cursor:pointer;font-size:1rem;box-shadow:0 5px 0 #e0457c,0 8px 16px rgba(255,92,138,.3)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #e0457c}
/* Sampul */
.cover{position:relative;margin:0 auto;width:min(290px,76vw);aspect-ratio:3/4;border-radius:10px 26px 26px 10px;background:radial-gradient(rgba(255,255,255,.55) 3px,transparent 4px) 0 0/22px 22px,linear-gradient(160deg,#ffc2d9,#ff8fb8);border-left:14px solid #ff6f9f;box-shadow:0 18px 30px rgba(255,92,138,.35);display:flex;flex-direction:column;align-items:center;color:#fff;transform-origin:left center;animation:fy 3s ease-in-out infinite}
@keyframes fy{50%{transform:translateY(-8px) rotate(1deg)}}
.cover::before{content:"";position:absolute;inset:10px;border:3px dashed #fff;border-radius:6px 18px 18px 6px;opacity:.9}
.cover.opening{animation:op .9s ease-in forwards}
@keyframes op{to{transform:perspective(900px) rotateY(-110deg) scale(.9);opacity:0}}
.face{position:relative;width:90px;height:56px;margin-top:34px}
.ey{position:absolute;top:8px;width:11px;height:14px;border-radius:50%;background:#5b2a4a;animation:bl 4s infinite}
.ey.l{left:16px}.ey.r{right:16px}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bs{position:absolute;top:26px;width:18px;height:10px;border-radius:50%;background:#ff7aa8;opacity:.8}
.bs.l{left:2px}.bs.r{right:2px}
.mo{position:absolute;left:50%;top:30px;width:18px;height:9px;margin-left:-9px;border-bottom:4px solid #5b2a4a;border-radius:0 0 18px 18px;transition:all .2s}
.face.oh .mo{height:16px;border:4px solid #5b2a4a;border-radius:50%;top:28px}
.face.yay .mo{width:26px;margin-left:-13px;height:14px;background:#ff5c8a;border-radius:0 0 26px 26px}
.cover h2{font-family:var(--fh);font-weight:400;font-size:1.55rem;margin:12px 16px 2px;text-shadow:0 2px 0 #e0457c}
.cover small{font-size:.95rem}
.strap{position:absolute;left:-14px;right:0;top:62%;height:34px;background:repeating-linear-gradient(90deg,#ffd966 0 10px,#fff 10px 20px);transition:all .8s;box-shadow:0 3px 6px rgba(0,0,0,.15)}
.strap.gone{transform:translateY(46px) rotate(5deg);opacity:0}
.seal{position:absolute;left:50%;top:62%;width:78px;height:78px;margin:-22px 0 0 -39px;cursor:pointer;z-index:3;animation:pp 1.6s ease-in-out infinite}
@keyframes pp{50%{transform:scale(1.1)}}
.w{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9ec0,#ff4d7d);border:4px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.1rem;transition:all .9s ease-in;box-shadow:0 4px 10px rgba(224,69,124,.5)}
.w.a{clip-path:polygon(0 0,55% 0,45% 25%,58% 50%,44% 75%,55% 100%,0 100%)}
.w.b{clip-path:polygon(55% 0,100% 0,100% 100%,55% 100%,44% 75%,58% 50%,45% 25%)}
.seal.sh{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-7px) rotate(-10deg)}50%{transform:translateX(7px) rotate(10deg)}80%{transform:translateX(-4px)}}
.seal.broken{pointer-events:none;animation:none}
.seal.broken .a{transform:translate(-30px,260px) rotate(-70deg);opacity:0}
.seal.broken .b{transform:translate(30px,260px) rotate(70deg);opacity:0}
#info{margin-top:22px;font-size:1.1rem;color:var(--ink)}
#openbtn{display:none;animation:pl 1.2s infinite}
@keyframes pl{50%{transform:scale(1.08)}}
/* Buku dua lembar */
#s2{max-width:540px;padding:10px}
.book{position:relative;background:linear-gradient(160deg,#ffc2d9,#ff8fb8);border-radius:16px;padding:10px;box-shadow:0 8px 0 #e0457c,0 18px 30px rgba(255,92,138,.3)}
.sheets{position:relative;display:flex;height:390px;perspective:1600px}
.sheets::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:16px;margin-left:-8px;background:linear-gradient(90deg,transparent,rgba(160,90,134,.28),transparent);pointer-events:none;z-index:6}
.pg{flex:1;min-width:0;height:100%;overflow:hidden;padding:14px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.pg.L{border-radius:8px 0 0 8px;background:linear-gradient(90deg,#fffdf7 78%,#f1dccd);box-shadow:-3px 3px 0 #ffd0e2}
.pg.R{border-radius:0 8px 8px 0;background:linear-gradient(90deg,#f1dccd,#fffdf7 22%);box-shadow:3px 3px 0 #ffd0e2}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;display:none;z-index:4}
.leaf.show{display:block}
.leaf.lf{left:0;transform-origin:right center}
.fc.pg{position:absolute;inset:0;height:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc.bkf{transform:rotateY(180deg)}
.leaf.show .fc{animation:shade .85s ease-in-out}
@keyframes shade{50%{filter:brightness(.86)}}
@keyframes wg{50%{transform:rotate(14deg) scale(1.15)}}
@keyframes wb{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.pol{position:relative;background:#fff;padding:6px 6px 20px;border-radius:5px;box-shadow:0 5px 14px rgba(160,90,134,.3);width:100%;max-width:158px;cursor:pointer;animation:wb 4s ease-in-out infinite}
.pol::before{content:"";position:absolute;top:-9px;left:50%;width:56px;height:17px;margin-left:-28px;background:rgba(255,217,102,.85);transform:rotate(-4deg)}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px}
.cap{font-size:.8rem;color:var(--soft);margin-top:14px}
.tgl{font-size:.78rem;color:var(--pink);margin-top:2px;font-weight:600}
.ti{font-family:var(--fh);font-weight:400;font-size:1.3rem;color:var(--pink);margin:.2em 0 .4em}
.mg{font-size:.92rem;line-height:1.55;margin:0}
.stk{font-size:1.5rem;margin-top:10px;animation:wg 2.5s ease-in-out infinite}
.nav{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px}
#dots{color:var(--pink);letter-spacing:2px;font-size:.85rem}
.flags{display:flex;justify-content:center;margin:-6px -4px 0}
.flags span{border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--pink2);animation:wg 2s ease-in-out infinite}
.flags span:nth-child(4n+2){border-top-color:var(--sun)}
.flags span:nth-child(4n+3){border-top-color:var(--mint)}
.flags span:nth-child(4n){border-top-color:var(--sky)}
.flags span:nth-child(even){animation-delay:.5s}
.ttl{font-family:var(--fh);font-size:1.45rem;color:var(--pink);margin:.4em 0 0;text-shadow:2px 2px 0 #fff}
.nmx{font-family:var(--fh);font-size:1.05rem;color:var(--ink);margin:.3em 0}
.hint{font-size:.85rem;color:var(--soft);margin:.4em 0 0}
.pg button{font-size:.9rem;padding:.55em 1.1em;margin-top:.6em}
.cake{position:relative;width:150px;margin:30px auto 0}
.cds{display:flex;justify-content:center;gap:18px;position:relative;z-index:2;margin-bottom:-3px}
.cd{position:relative;width:10px;height:34px;border-radius:4px;background:repeating-linear-gradient(45deg,var(--lilac) 0 6px,#fff 6px 12px)}
.fm{position:absolute;left:50%;top:-26px;margin-left:-7px;width:14px;height:22px;background:radial-gradient(#fff7ae,#ffd24a 60%,#ff9a3c);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform-origin:bottom;animation:fk .25s infinite alternate;transition:opacity .4s;box-shadow:0 0 16px 6px rgba(255,210,74,.55)}
.fm.off{opacity:0;animation:none}
@keyframes fk{to{transform:scale(1.12,.9) rotate(4deg)}}
.t{margin:0 auto;border-radius:12px 12px 5px 5px;position:relative;background-image:radial-gradient(#fff 2px,transparent 3px),radial-gradient(var(--sun) 2px,transparent 3px);background-size:16px 16px,22px 22px;background-position:0 7px,8px 15px}
.t::after{content:"";position:absolute;left:0;right:0;top:0;height:12px;border-radius:12px 12px 50% 50%/12px 12px 9px 9px;background:#fff}
.t1{width:70px;height:34px;background-color:#ff9ec0}
.t2{width:110px;height:38px;background-color:#ff7aa8;margin-top:-2px}
.t3{width:150px;height:44px;background-color:#ff5c8a;margin-top:-2px}
.plate{width:170px;height:8px;margin:0 auto;border-radius:50%;background:var(--mint)}
.pop{animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#lb{position:fixed;inset:0;background:rgba(91,42,74,.8);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:10px;border:6px solid #fff}
#mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:70;display:none;padding:.4em .7em;margin:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mu">🔊</button>
<div id="lb"><img id="lbi" alt="Foto"></div>

<section class="screen on" id="s1">
  <div class="cover" id="cover">
    <div class="face" id="face"><i class="ey l"></i><i class="ey r"></i><i class="bs l"></i><i class="bs r"></i><i class="mo"></i></div>
    <h2>Untuk Yang Terkasih</h2>
    <small>Aulia Nuryanti</small>
    <div class="strap" id="strap"></div>
    <div class="seal" id="seal"><div class="w a">♥</div><div class="w b">♥</div></div>
  </div>
  <p id="info">Bukunya tersegel! Ketuk segelnya 5 kali ya 💕</p>
  <button id="openbtn">Buka Buku 📖</button>
</section>

<section class="screen" id="s2">
  <div class="book" id="bk"><div class="sheets" id="sh">
    <div class="pg L" id="pl"></div><div class="pg R" id="pr"></div>
    <div class="leaf" id="lf"><div class="fc pg" id="lfF"></div><div class="fc pg bkf" id="lfB"></div></div>
  </div></div>
  <div class="nav"><button id="pv">◀</button><span id="dots"></span><button id="nx">▶</button></div>
</section>

<script>
// ===== Ubah bagian ini =====
var NAMA="Aulia Nuryanti";
function ph(n,e,a,b){
  var s="<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='"+a+"'/><stop offset='1' stop-color='"+b+"'/></linearGradient></defs><rect width='600' height='600' fill='url(#g)'/><text x='300' y='340' font-size='200' text-anchor='middle'>"+e+"</text><text x='300' y='500' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif'>Foto "+n+"</text></svg>";
  return "data:image/svg+xml;utf8,"+encodeURIComponent(s);
}
// FOTO: taruh di folder img/ dengan nama foto1.jpg, foto2.jpg, foto3.jpg, dst.
// Setiap {...} di bawah = satu halaman buku (objek ke-N memakai img/fotoN.jpg).
// Mau tambah halaman? Tambah satu {t:"judul",m:"ucapan"} lalu tambah fotoN.jpg.
var TEKS=[
 {d:"10 Mei 2026",t:"Hari Istimewamu",m:"Selamat ulang tahun, Aulia! Hari ini milikmu sepenuhnya. Semoga setiap detiknya dipenuhi tawa dan bahagia."},
 {d:"30 Mei 2026",t:"Harapanku",m:"Semoga kamu selalu sehat, tenang hatinya, dan dikelilingi orang-orang yang menyayangimu."},
 {d:"25 Agustus 2026",t:"Doaku",m:"Semoga semua mimpimu satu per satu jadi nyata, dan semua lelahmu terbayar dengan hal-hal indah."},
 {d:"13 September 2026",t:"Terima Kasih",m:"Terima kasih sudah hadir di hidupku dan membuat hari-hariku lebih berwarna."},
 {d:"08 Februari 2026",t:"Janjiku",m:"Aku akan terus ada di sampingmu, merayakan hari-hari bahagia dan menemani di hari yang berat."}
];
// Gambar cadangan (tampil kalau fotoN.jpg belum ada)
var EMO=["🌸","🌈","🦋","🌻","🧸"],G1=["#ffb3cf","#8fd3ff","#7ee0c3","#ffd966","#c9b6ff"],G2=["#ffd966","#c9b6ff","#8fd3ff","#ffb3cf","#ffb3cf"];
var PAGES=TEKS.map(function(x,i){return {f:"img/foto"+(i+1)+".jpg",fb:ph(i+1,EMO[i%5],G1[i%5],G2[i%5]),t:x.t,m:x.m,d:x.d}});
// ===========================

var $=function(i){return document.getElementById(i)};
function show(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on")});$(id).classList.add("on")}
function type(el,t){el.textContent="";var k=0;clearInterval(el._t);el._t=setInterval(function(){el.textContent=t.slice(0,++k);if(k>=t.length)clearInterval(el._t)},28)}

var cv=$("c"),cx=cv.getContext("2d"),P=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
var COL=["#ff5c8a","#ff9ec0","#ffd966","#7ee0c3","#8fd3ff","#c9b6ff","#ffa66b"];
function confetti(n){for(var i=0;i<n;i++)P.push({t:0,x:Math.random()*cv.width,y:-10-Math.random()*80,vx:Math.random()*4-2,vy:Math.random()*3+2,s:Math.random()*8+4,c:COL[i%7],r:Math.random()*6});go()}
function firework(x,y,h,n){h=h==null?Math.random()*360:h;for(var i=0;i<(n||70);i++){var a=Math.random()*6.283,v=Math.random()*5+1.5;P.push({t:1,x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:70+Math.random()*30,m:100,h:h+Math.random()*40})}go()}
function salvo(n){for(var i=0;i<n;i++)setTimeout(function(){firework(cv.width*(.15+Math.random()*.7),cv.height*(.15+Math.random()*.35))},i*350)}
function go(){if(!run){run=true;tick()}}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  P=P.filter(function(p){return p.t?p.l>0:p.y<cv.height+20});
  P.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;
    if(p.t){p.vy+=.06;p.vx*=.99;p.l--;cx.globalAlpha=Math.max(p.l/p.m,0);cx.fillStyle="hsl("+p.h+",100%,65%)";cx.beginPath();cx.arc(p.x,p.y,2.6,0,6.283);cx.fill();cx.globalAlpha=1}
    else{p.r+=.12;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
  });
  if(P.length)requestAnimationFrame(tick);else run=false;
}
function floater(e,x){
  var s=document.createElement("span");s.className="fl";s.textContent=e;
  s.style.left=(x==null?Math.random()*95:x)+"vw";s.style.fontSize=(18+Math.random()*30)+"px";
  s.style.animationDuration=(5+Math.random()*5)+"s";document.body.appendChild(s);
  setTimeout(function(){s.remove()},10500);
}
var EM=["🎈","💖","✨","🎉","🌸","💗","🍭","🧁"];
setInterval(function(){if(document.querySelectorAll(".fl").length<14)floater(EM[Math.floor(Math.random()*EM.length)])},700);
document.addEventListener("click",function(e){
  for(var i=0;i<3;i++){var s=document.createElement("span");s.className="fl";s.textContent=["💖","✨","💗"][i];s.style.left=(e.clientX/innerWidth*100+(i-1)*4)+"vw";s.style.bottom=(innerHeight-e.clientY-20)+"px";s.style.fontSize="22px";s.style.animationDuration="2.2s";document.body.appendChild(s);(function(n){setTimeout(function(){n.remove()},2300)})(s)}
});

// Lagu ulang tahun (file mp3): mulai saat buku dibuka
var AC=null,muted=false;
var AUDIO_SRC="audio/lagu.mp3";
var BGM=new Audio(AUDIO_SRC);BGM.loop=true;BGM.preload="auto";
function startSong(){try{BGM.currentTime=0;BGM.play()}catch(e){}$("mu").style.display="block"}
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended"&&!muted)AC.resume()}catch(e){}return AC}
function noise(d,f0,f1,g,q,dl){var a=ac();if(!a)return;var n=Math.floor(a.sampleRate*d),bf=a.createBuffer(1,n,a.sampleRate),x=bf.getChannelData(0);for(var i=0;i<n;i++)x[i]=Math.random()*2-1;var sr=a.createBufferSource();sr.buffer=bf;var fl=a.createBiquadFilter();fl.type="bandpass";fl.Q.value=q||1;var t=a.currentTime+(dl||0);fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);var v=a.createGain();v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+d*.3);v.gain.exponentialRampToValueAtTime(.0001,t+d);sr.connect(fl);fl.connect(v);v.connect(a.destination);sr.start(t)}
function tone(ty,f0,f1,d,g,dl){var a=ac();if(!a)return;var t=a.currentTime+(dl||0),o=a.createOscillator(),v=a.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function sfxTap(n){tone("sine",260+n*50,620+n*110,.16,.3);tone("square",120,60,.08,.07);noise(.1,3000,1500,.35,2)}
function sfxBreak(){noise(.4,2500,300,.7,.8);tone("sine",200,900,.25,.3);[523,659,784,1047,1319].forEach(function(f,i){tone("triangle",f,f*1.001,.35,.22,.12+i*.09)})}
function sfxFlip(){noise(.55,700,3200,.5,.9);noise(.18,5000,2500,.25,1.5,.1);tone("sine",130,70,.12,.12,.72)}
$("mu").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊";BGM.muted=muted;if(AC){muted?AC.suspend():AC.resume()}};

// Segel
var taps=0,NEED=5,broken=false,seal=$("seal"),face=$("face");
seal.onclick=function(){
  if(broken)return;taps++;ac();
  var r=seal.getBoundingClientRect(),x0=r.left+r.width/2,y0=r.top+r.height/2;
  seal.classList.remove("sh");void seal.offsetWidth;seal.classList.add("sh");
  face.classList.add("oh");setTimeout(function(){face.classList.remove("oh")},350);
  if(taps>=NEED){
    broken=true;seal.classList.add("broken");$("strap").classList.add("gone");face.classList.add("yay");
    sfxBreak();firework(x0,y0,330,70);confetti(50);
    $("info").textContent="Yeay, segelnya terlepas! ✨";$("openbtn").style.display="inline-block";
  }else{
    sfxTap(taps);firework(x0,y0,330,16);
    $("info").textContent="Ketuk lagi "+(NEED-taps)+" kali! 💕";
  }
};
$("openbtn").onclick=function(){
  $("cover").classList.add("opening");this.style.display="none";
  startSong();
  setTimeout(function(){show("s2");render()},850);
};

// Halaman buku (dua lembar: kiri dan kanan)
var STK=["🌸","⭐","🍭","🧸","🦋"],HB="Semoga semua permintaanmu terkabul, yang ke-27 ini lebih indah ✨";
var idx=0,TOT=PAGES.length+1,blown=false,busy=false,LAST=PAGES.length;
function cakeHTML(){var o=blown?" off":"";return '<div class="cake"><div class="cds"><div class="cd"><i class="fm'+o+'"></i></div><div class="cd"><i class="fm'+o+'"></i></div><div class="cd"><i class="fm'+o+'"></i></div></div><div class="t t1"></div><div class="t t2"></div><div class="t t3"></div></div><div class="plate"></div><div class="cap">Tiup lilinnya 🎈</div>'}
function pgL(i){
  if(i===LAST)return cakeHTML();
  return '<div class="pol"><img class="ph" src="'+PAGES[i].f+'" data-fb="'+PAGES[i].fb+'" onerror="this.onerror=null;this.src=this.dataset.fb" alt="Kenangan"></div><div class="cap">Kenangan '+(i+1)+'</div><div class="tgl">'+(PAGES[i].d||"")+'</div>';
}
function pgR(i){
  if(i===LAST)return '<div class="flags"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="ttl">Selamat Ulang Tahun!</div><div class="nmx'+(blown?" pop":"")+'">'+NAMA+' 💖</div><p class="hint">'+(blown?HB:"Buat permintaan, lalu tiup lilinnya 🎈")+'</p><button class="blow">'+(blown?"Rayakan lagi 🎆":"Tiup lilin 🎂")+'</button>';
  var p=PAGES[i];return '<h2 class="ti">'+p.t+'</h2><p class="mg">'+p.m+'</p><div class="stk">'+STK[i%STK.length]+'</div>';
}
function updateNav(){
  $("pv").style.visibility=idx?"visible":"hidden";$("nx").style.visibility=idx===LAST?"hidden":"visible";
  var d="";for(var k=0;k<TOT;k++)d+=k===idx?"●":"○";$("dots").textContent=d;
}
function render(){$("pl").innerHTML=pgL(idx);$("pr").innerHTML=pgR(idx);updateNav()}
function turn(n){
  if(busy||n<0||n>=TOT)return;busy=true;
  var lf=$("lf"),fw=n>idx;
  sfxFlip();
  lf.className="leaf show"+(fw?"":" lf");
  lf.style.transition="none";lf.style.transform="rotateY(0deg)";
  if(fw){$("lfF").className="fc pg R";$("lfB").className="fc pg L bkf";$("lfF").innerHTML=pgR(idx);$("lfB").innerHTML=pgL(n);$("pr").innerHTML=pgR(n)}
  else{$("lfF").className="fc pg L";$("lfB").className="fc pg R bkf";$("lfF").innerHTML=pgL(idx);$("lfB").innerHTML=pgR(n);$("pl").innerHTML=pgL(n)}
  void lf.offsetWidth;
  lf.style.transition="transform .85s cubic-bezier(.45,.05,.35,1)";
  lf.style.transform="rotateY("+(fw?-180:180)+"deg)";
  setTimeout(function(){
    idx=n;render();lf.className="leaf";lf.style.transition="none";lf.style.transform="none";busy=false;
    if(idx===LAST&&!blown)confetti(60);
  },880);
}
$("nx").onclick=function(){turn(idx+1)};
$("pv").onclick=function(){turn(idx-1)};
var sx=0,sh=$("sh");
sh.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
sh.addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-sx;if(dx<-60)turn(idx+1);else if(dx>60)turn(idx-1)});
$("lb").onclick=function(){this.classList.remove("on")};
function blow(){
  if(!blown){
    blown=true;
    document.querySelectorAll(".fm").forEach(function(x){x.classList.add("off")});
    document.querySelectorAll(".hint").forEach(function(x){x.textContent=HB});
    document.querySelectorAll(".blow").forEach(function(x){x.textContent="Rayakan lagi 🎆"});
    document.querySelectorAll(".nmx").forEach(function(x){x.classList.add("pop")});
  }
  confetti(200);salvo(7);for(var i=0;i<8;i++)floater("🎈",6+i*12);
}
$("bk").addEventListener("click",function(e){
  var t=e.target;
  if(t.classList.contains("ph")){$("lbi").src=t.src;$("lb").classList.add("on")}
  else if(t.classList.contains("blow"))blow();
});
</script>
</body>
</html>
